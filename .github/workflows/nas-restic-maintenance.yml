name: NAS — Restic maintenance

# Déploiement manuel uniquement, indépendant du workflow Deploy (test/prod).
# Dépose les fichiers sur le NAS ; n'exécute jamais restic.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Inventaire cible
        required: true
        default: test
        type: choice
        options: [test]
      apply:
        description: Appliquer les changements (sinon --check --diff)
        required: true
        default: false
        type: boolean

concurrency:
  group: nas-restic-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Restic maintenance → NAS (${{ inputs.environment }})
    runs-on: [self-hosted, homelab, "${{ inputs.environment }}"]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # Clé dédiée au NAS (secret de l'environnement GitHub, pas ANSIBLE_SSH_KEY).
      # La clé d'hôte est épinglée dans inventories/<env>/nas_known_hosts.
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAS_SSH_KEY }}

      - name: Show Ansible version
        run: ansible --version

      - name: Deploy
        working-directory: infra/ansible
        env:
          TARGET_ENV: ${{ inputs.environment }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--diff)
          if [ "$APPLY" != "true" ]; then
            args+=(--check)
          fi
          ansible-playbook -i "inventories/${TARGET_ENV}/hosts.ini" playbooks/nas.yml "${args[@]}"
