name: Secrets Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# pull-requests: read : gitleaks-action liste les commits de la PR (GET /pulls/N/commits),
# refusé sans cette permission quand le dépôt est privé.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
