# Connexion au NAS : playbooks/group_vars/nas.yml (commune aux environnements).

# Maintenance Restic du repository docker-test. Contrôle quotidien en dry-run ; opérations
# réelles (forget, prune) activées ci-dessous, lancées par les tâches DSM ID 26 (contrôle),
# 27 (forget) et 28 (prune). La production les active dans son propre inventaire ; les
# valeurs par défaut du rôle restent à false.
restic_maintenance_name: docker-test
restic_maintenance_repository: /volume1/Restic/docker-test
restic_maintenance_password_file: /volume1/docker/restic-maintenance/secrets/restic_password_test

# Groupes attendus : chemins exacts, pas de préfixe (/srv/docker n'est pas autorisé).
restic_maintenance_groups:
  - name: core
    host: docker-test-01
    paths: [/srv/docker/core]
    tags: [core, test]
  # Snapshot de validation historique : figé, aucun nouveau snapshot accepté.
  - name: validation
    host: docker-test-01
    paths: [/tmp/restic-test]
    tags: [validation]
    frozen_ids: ["1e30db7a"]

# Opérations réelles, validées sur docker-test le 29/10/2026 avant l'activation en prod.
# repository_owner : 0:0 confirmé par le relevé du NAS (README « Validations sur le NAS ») ;
# le script refuse toute écriture si le propriétaire diffère.
restic_maintenance_apply:
  forget: true
  prune: true
  prune_max_unused: "5%"
  repository_owner: "0:0"
  protected:
    start: "04:55"
    end: "08:00"
