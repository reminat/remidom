# Connexion au NAS : playbooks/group_vars/nas.yml (commune aux environnements).

# Maintenance Restic du repository docker-prod. Contrôle quotidien en dry-run ; opérations
# réelles (forget, prune) activées ci-dessous, lancées seulement par les tâches DSM dédiées.
# Même politique de rétention et mêmes seuils que le test (valeurs par défaut du rôle).
restic_maintenance_name: docker-prod
restic_maintenance_repository: /volume1/Restic/docker-prod
restic_maintenance_password_file: /volume1/docker/restic-maintenance/secrets/restic_password_prod

# Groupe attendu : la sauvegarde de docker-prod-01 (rôle restic_backup, tags core,prod).
restic_maintenance_groups:
  - name: core
    host: docker-prod-01
    paths: [/srv/docker/core]
    tags: [core, prod]

# Opérations réelles. À ne merger qu'après : relevé du repository docker-prod (propriétaire
# ci-dessous), conditions du README « Droits des fichiers écrits par restic » (Hyper Backup
# validé, lecteurs identifiés) et marquage keep de 75eeb351 reconnu au contrôle.
restic_maintenance_apply:
  forget: true
  prune: true
  prune_max_unused: "5%"
  repository_owner: "0:0"      # à confirmer par le relevé de docker-prod
  # Provisoire : fin à confirmer selon la durée réelle de Hyper Backup (06:00).
  protected:
    start: "04:55"
    end: "08:00"
