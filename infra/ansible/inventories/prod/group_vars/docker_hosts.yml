docker_users:
  - remi

docker_data_root: /srv/docker

docker_repo_root: "{{ playbook_dir }}/../../.."

compose_projects:
  - name: core
    src: "{{ docker_repo_root }}/services/docker/core"
    dest: /srv/docker/core


mqtt_user: mqtt
mqtt_password: "{{ lookup('env', 'MQTT_PASSWORD') }}"

smlight_serial_url: "tcp://smlight.reminat.com:6638"
smlight_adapter: ember
z2m_network_key: "{{ (lookup('env', 'Z2M_NETWORK_KEY') | default('\"GENERATE\"', true)) | from_json }}"

domain_base: reminat.com
haos_url: "http://haos-vm.reminat.com:8123"
unifi_url: "https://10.10.1.1"
code_url: "http://10.10.20.10:8080"
proxmox_url: "https://10.10.20.2:8006"
cf_api_token: "{{ lookup('env', 'CF_DNS_API_TOKEN') }}"

# Sauvegarde Restic de /srv/docker/core vers le REST Server du NAS (repository docker-prod).
# Secrets : restic_repository_prod et restic_password_prod (Bitwarden Secrets Manager).
restic_backup_enabled: true
restic_backup_timer_enabled: false   # à activer après la première sauvegarde et le test de restauration
restic_backup_tags: [core, prod]
# Sauvegarde à chaud : Mosquitto, Zigbee2MQTT et Node-RED écrivent leurs fichiers par
# remplacement atomique (copie cohérente). Seul Portainer (base BoltDB modifiée sur place)
# est arrêté le temps de la sauvegarde : voir HOWTO, « Sauvegarde Restic des hôtes Docker ».
restic_backup_stop_services: [portainer]

# GitHub Actions self-hosted runner
github_runner_repo: reminat/remidom
github_runner_name: docker-prod
github_runner_labels: "homelab,prod"
# github_runner_registration_token: à passer en extra-var lors de l'installation initiale
#   ./deploy.sh prod -e github_runner_registration_token=TOKEN
