# Avant tout rendu : couvre aussi un ansible-playbook lancé sans deploy.sh, où les variables
# d'environnement sont vides. Aucune valeur affichée (no_log), seulement l'échec de la tâche.
- name: Check compose secrets presence
  ansible.builtin.assert:
    that:
      - mqtt_password | trim | length > 0
      - mqtt_password | trim != 'null'
      - "'\n' not in mqtt_password"
      - cf_api_token | trim | length > 0
      - cf_api_token | trim != 'null'
      - "'\n' not in cf_api_token"
      # Tableau de 16 octets : aucune valeur de repli.
      - z2m_network_key is sequence
      - z2m_network_key is not string
      - z2m_network_key is not mapping
      - z2m_network_key | length == 16
      - z2m_network_key | reject('integer') | list | length == 0
      - z2m_network_key | min >= 0
      - z2m_network_key | max <= 255
    quiet: true
  no_log: true
  when: compose_projects | selectattr('name', 'equalto', 'core') | list | length > 0
