- name: Ensure project directories exist
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    mode: "0755"
  loop: "{{ compose_projects }}"

- name: Sync compose projects to host
  ansible.posix.synchronize:
    src: "{{ item.src }}/"
    dest: "{{ item.dest }}/"
    delete: false
    recursive: true
    rsync_opts:
      - "--checksum"
      - "--exclude=zigbee2mqtt/data/configuration.yaml.j2"
      - "--exclude=zigbee2mqtt/data/configuration.yaml"
      - "--exclude=.env.j2"
      - "--exclude=traefik/traefik.yml.j2"
      - "--exclude=traefik/dynamic/*.j2"
      - "--exclude=traefik/acme/"
  loop: "{{ compose_projects }}"

- name: Render .env
  ansible.builtin.template:
    src: "{{ item.src }}/.env.j2"
    dest: "{{ item.dest }}/.env"
    mode: "0640"
  no_log: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Render Traefik static configuration
  ansible.builtin.template:
    src: "{{ item.src }}/traefik/traefik.yml.j2"
    dest: "{{ item.dest }}/traefik/traefik.yml"
    mode: "0644"
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Traefik dynamic directory exists
  ansible.builtin.file:
    path: "{{ item.dest }}/traefik/dynamic"
    state: directory
    mode: "0755"
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Render Traefik dynamic configuration (haos)
  ansible.builtin.template:
    src: "{{ item.src }}/traefik/dynamic/haos.yml.j2"
    dest: "{{ item.dest }}/traefik/dynamic/haos.yml"
    mode: "0644"
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Traefik acme directory exists
  ansible.builtin.file:
    path: "{{ item.dest }}/traefik/acme"
    state: directory
    mode: "0700"
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure acme.json exists with correct permissions
  ansible.builtin.file:
    path: "{{ item.dest }}/traefik/acme/acme.json"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Render Zigbee2MQTT configuration
  ansible.builtin.template:
    src: "{{ item.src }}/zigbee2mqtt/data/configuration.yaml.j2"
    dest: "{{ item.dest }}/zigbee2mqtt/data/configuration.yaml"
    mode: "0640"
    owner: "1883"
    group: "1883"
  no_log: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Remove stale Zigbee2MQTT template file from target
  ansible.builtin.file:
    path: "{{ item.dest }}/zigbee2mqtt/data/configuration.yaml.j2"
    state: absent
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Node-RED data directory has the correct ownership
  ansible.builtin.file:
    path: "{{ item.dest }}/nodered/data"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Mosquitto config directory has the correct ownership
  ansible.builtin.file:
    path: "{{ item.dest }}/mosquitto/config"
    state: directory
    owner: "1883"
    group: "1883"
    mode: "0750"
    recurse: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Mosquitto data directory has the correct ownership
  ansible.builtin.file:
    path: "{{ item.dest }}/mosquitto/data"
    state: directory
    owner: "1883"
    group: "1883"
    mode: "0750"
    recurse: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Mosquitto log directory has the correct ownership
  ansible.builtin.file:
    path: "{{ item.dest }}/mosquitto/log"
    state: directory
    owner: "1883"
    group: "1883"
    mode: "0750"
    recurse: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Fail if mqtt_password is empty
  ansible.builtin.fail:
    msg: "mqtt_password est vide — MQTT_PASSWORD non défini ou secret introuvable dans BWS"
  when:
    - item.name == 'core'
    - mqtt_password | length == 0
  loop: "{{ compose_projects }}"

- name: Ensure Mosquitto password file contains current credentials
  ansible.builtin.command:
    cmd: >
      docker run --rm
      -v {{ item.dest }}/mosquitto/config:/mosquitto/config
      eclipse-mosquitto:2
      sh -lc "touch /mosquitto/config/passwords && mosquitto_passwd -b /mosquitto/config/passwords {{ mqtt_user }} {{ mqtt_password }}"
  no_log: true
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Ensure Mosquitto password file permissions are correct
  ansible.builtin.file:
    path: "{{ item.dest }}/mosquitto/config/passwords"
    state: file
    owner: "1883"
    group: "1883"
    mode: "0640"
  loop: "{{ compose_projects }}"
  when: item.name == 'core'

- name: Docker compose pull
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ item.dest }}"
  loop: "{{ compose_projects }}"
  changed_when: false

- name: Docker compose up
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ item.dest }}"
  loop: "{{ compose_projects }}"

- name: Reload Mosquitto to apply password file updates
  ansible.builtin.command:
    cmd: docker compose exec -T mosquitto kill -HUP 1
    chdir: "{{ item.dest }}"
  loop: "{{ compose_projects }}"
  when: item.name == 'core'
  changed_when: false
