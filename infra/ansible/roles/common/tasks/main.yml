- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - unzip
      - jq
      - python3-yaml   # module z2m_config (compose_deploy)
    update_cache: true
    state: present